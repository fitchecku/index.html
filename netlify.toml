# Personal app: keep it out of search engines and lock down browser features.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The service worker must always be revalidated so app updates reach your phone.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
